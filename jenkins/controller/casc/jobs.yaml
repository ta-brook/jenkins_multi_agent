# Seed jobs created by JCasC via Job DSL on first boot.
# The top-level pipeline job expects a Jenkinsfile in the SCM repo (Phase 4);
# until that file exists the job will fail on first build, by design.
jobs:
  - script: |
      pipelineJob('jenkins_multi_agent-main') {
        description('Top-level multi-env pipeline: build once, promote dev -> staging -> prod.')
        logRotator(-1, 20, -1, 5)
        // Parameters defined in the seed so the job is parameterized even on
        // the first SCM-triggered build (before the Jenkinsfile is loaded and
        // the pipeline's own parameters block is registered).
        parameters {
          stringParam('REGISTRY_HOST', 'registry:5000', 'Registry host:port images are pushed to / pulled from.')
          stringParam('IMAGE_REPO', 'jenkins-multi-agent/sample-app', 'Image repository name under REGISTRY_HOST.')
          stringParam('TARGET_ENV', 'prod', 'Highest environment to promote to: dev | staging | prod')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${GIT_REPO_URL}')
                }
                branches('*/main')
                extensions {
                  cleanBeforeCheckout()
                }
              }
            }
            lightweight(true)
          }
        }
        // Config-as-code trigger: SCM polling. A webhook (e.g. GitHub) needs
        // the controller URL + credentials, configured once the controller is live.
        triggers {
          scm('H/2 * * * *')
        }
      }
  - script: |
      freeStyleJob('smoke-docker-build') {
        description('Smoke test: runs on an ephemeral docker-build agent and cleans up after itself.')
        label('docker-build')
        steps {
          shell('echo "smoke ok on $(hostname)" && docker info >/dev/null && echo "docker socket reachable"')
        }
      }
