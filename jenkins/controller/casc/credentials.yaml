# Env-scoped credentials. Every value is injected from the environment at boot.
# Isolation rule: dev/staging/prod are separate credential IDs; a pipeline
# stage for environment X binds ONLY credential id *-X. No secret is committed.
# Prod credentials are never referenced by dev/staging-labeled jobs.
#
# NOTE: docker-host-a/b below are plain username/password placeholders so the
# JCasC cloud references resolve. If you secure the Docker API with TLS client
# certs, replace these with a 'certificate' credential carrying the client
# keystore and keep the same IDs.
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "docker-host-a"
              username: "${DOCKER_HOST_A_USERNAME}"
              password: "${DOCKER_HOST_A_PASSWORD}"
              description: "Docker API auth for host A"
          - usernamePassword:
              scope: GLOBAL
              id: "docker-host-b"
              username: "${DOCKER_HOST_B_USERNAME}"
              password: "${DOCKER_HOST_B_PASSWORD}"
              description: "Docker API auth for host B"
          - usernamePassword:
              scope: GLOBAL
              id: "registry-dev"
              username: "${REGISTRY_USERNAME}"
              password: "${REGISTRY_PASSWORD_DEV}"
              description: "Image registry login for dev"
          - usernamePassword:
              scope: GLOBAL
              id: "registry-staging"
              username: "${REGISTRY_USERNAME}"
              password: "${REGISTRY_PASSWORD_STAGING}"
              description: "Image registry login for staging"
          - usernamePassword:
              scope: GLOBAL
              id: "registry-prod"
              username: "${REGISTRY_USERNAME}"
              password: "${REGISTRY_PASSWORD_PROD}"
              description: "Image registry login for prod"
          - string:
              scope: GLOBAL
              id: "deploy-dev"
              secret: "${DEPLOY_TOKEN_DEV}"
              description: "Deploy token for dev environment"
          - string:
              scope: GLOBAL
              id: "deploy-staging"
              secret: "${DEPLOY_TOKEN_STAGING}"
              description: "Deploy token for staging environment"
          - string:
              scope: GLOBAL
              id: "deploy-prod"
              secret: "${DEPLOY_TOKEN_PROD}"
              description: "Deploy token for prod environment"
